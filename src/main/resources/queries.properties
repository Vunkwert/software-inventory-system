sql.computers.getAll=SELECT c.*, r.number as room_number, e.full_name as emp_name \
                         FROM computers c \
                         LEFT JOIN rooms r ON c.room_id = r.id \
                         LEFT JOIN employees e ON c.employee_id = e.id \
                         ORDER BY c.id
sql.computers.delete=DELETE FROM computers WHERE id = ?

sql.proc.installSoftware=CALL add_software_to_room(?, ?)

sql.software.getAll=SELECT * FROM software ORDER BY name

sql.report.byRoom=SELECT r.number as room, s.name as soft, s.version, c.inventory_number as pc \
                   FROM installations i \
                   JOIN computers c ON i.computer_id = c.id \
                   JOIN rooms r ON c.room_id = r.id \
                   JOIN software s ON i.software_id = s.id \
                   WHERE r.number = ?

sql.report.byPurpose=SELECT r.number as room, s.name as soft, s.version, c.inventory_number as pc \
                      FROM installations i \
                      JOIN computers c ON i.computer_id = c.id \
                      JOIN rooms r ON c.room_id = r.id \
                      JOIN software s ON i.software_id = s.id \
                      WHERE s.purpose = ?

sql.report.byCategory=SELECT r.number as room, s.name as soft, s.version, c.inventory_number as pc \
                       FROM installations i \
                       JOIN computers c ON i.computer_id = c.id \
                       JOIN rooms r ON c.room_id = r.id \
                       JOIN software s ON i.software_id = s.id \
                       JOIN software_categories sc ON s.category_id = sc.id \
                       WHERE sc.name = ?
sql.computers.getSoftware=SELECT s.id, s.name, s.version, s.vendor \
                          FROM installations i \
                          JOIN software s ON i.software_id = s.id \
                          WHERE i.computer_id = ?